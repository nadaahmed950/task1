<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Members</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; }
    h1 { text-align: center; }
    table { margin: 1.5rem auto; border-collapse: collapse; background: #fff; min-width: 320px; }
    th, td { border: 1px solid #ddd; padding: 10px 24px; text-align: center; }
    th { background: #2d6cdf; color: #fff; }
  </style>
</head>
<body>
  <h1> Team Members </h1>
  <table>
    <thead><tr><th>#</th><th>الاسم</th><th>ID</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    
    const team = [
      { name: "Nada Ahmed",  id: "20242369" },
      
    ];

    const tbody = document.getElementById("rows");
    team.forEach((m, i) => {
      const tr = document.createElement("tr");
      [i + 1, m.name, m.id].forEach(v => {
        const td = document.createElement("td");
        td.textContent = v;       
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
